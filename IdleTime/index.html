<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <div data-idletime-root>
            <style>
            
            [data-idletime-root] {
                all: initial;
                display: block;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
            }
            
            [data-idletime-root] *,
            [data-idletime-root] *::before,
            [data-idletime-root] *::after {
                box-sizing: border-box;
                font-family: inherit;
            }

            [data-idletime-root] .flit-icon {
                font-style: normal;
                font-size: 24px;
                line-height: 1;
                display: inline-block;
                text-align: center;
            }

            [data-idletime-root] .flit-center {
                text-align: center;
            }

            [data-idletime-root] .flit-accent {
                color: #ff6f00;
            }

            [data-idletime-root] .flit-row {
                display: flex;
                justify-content: center;
                margin: 0;
                width: 100%;
            }

            [data-idletime-root] .flit-col {
                width: 100%;
                max-width: 600px;
            }

            /*@media (min-width: 992px) {
                [data-idletime-root] .flit-col {
                    max-width: 66.6667%;
                }
            }*/
            
            [data-idletime-root] .flit-screensaver {
                animation: fadeIn 0.8s ease-in;
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                padding: 0 12px;
            }
            
            @keyframes fadeIn {
                from { opacity: 0; transform: scale(0.95); }
                to { opacity:  1; transform: scale(1); }
            }
            
            [data-idletime-root] .flit-card {
                border-radius: 16px !important;
                box-shadow: 0 16px 48px rgba(0,0,0,0.18) !important;
                margin: 0 !important;
                max-width: 600px;
                max-height: 550px;
                width: 100%;
                overflow: hidden;
                position: relative;
                background: white;
            }

            
            [data-idletime-root] .flit-card-image {
                padding-top: 12px;
            }
            
            [data-idletime-root] .flit-card-image img {
                border-radius: 14px;
                max-height: 110px !important;
                object-fit: contain !important;
                padding: 12px 44px !important;
                width: 100%;
                height: auto;
                image-rendering: -webkit-optimize-contrast;
            }
            
            [data-idletime-root] .flit-card-content {
                padding: 10px !important;
            }
            
            [data-idletime-root] .flit-value-prop {
                font-size: 1.05rem !important;
                line-height: 1.35 !important;
                margin: 0.35rem 0 !important;
            }

            [data-idletime-root] .flit-seasonal-banner {
                display: none;
                align-items: center;
                justify-content: center;
                gap: 8px;
                padding: 8px 10px;
                border-radius: 10px;
                font-weight: 700;
                font-size: 0.98rem;
                letter-spacing: 0.2px;
                color: #fff;
                margin: 0.25rem 0 0.35rem 0;
                position: relative;
                overflow: hidden;
                top: -4px;
                height: 40px;
                border-radius: 0px;
            }
            [data-idletime-root] .flit-seasonal-banner [data-seasonal-text] {
                position: relative;
                z-index: 2;
            }
            [data-idletime-root] .flit-seasonal-banner.flit-is-visible {
                display: flex;
            }

            [data-idletime-root] .flit-seasonal-banner .flit-seasonal-effects {
                position: absolute;
                inset: 0;
                pointer-events: none;
                z-index: 1;
            }

            [data-idletime-root] .flit-seasonal-banner .flit-spark {
                position: absolute;
                width: 10px;
                height: 10px;
                opacity: 0;
                transform-origin: center;
                transform: translate(-50%, -50%);
            }

            [data-idletime-root] .flit-spark-star {
                background: #fff6d5;
                clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
                box-shadow: 0 0 8px rgba(255, 246, 213, 0.8);
                animation: starFloat var(--dur, 3s) ease-in-out forwards;
                animation-delay: var(--delay, 0s);
                transform: translate(-50%, -50%) scale(var(--scale, 1));
            }

            [data-idletime-root] .flit-spark-firework {
                width: var(--sz, 9px);
                height: var(--sz, 9px);
                border-radius: 50%;
                background: hsl(var(--hue, 42), 95%, 64%);
                box-shadow:
                    0 calc(var(--sz, 9px) * -1.4) 0 hsla(var(--hue, 42), 95%, 64%, 0.9),
                    0 calc(var(--sz, 9px) * 1.4) 0 hsla(var(--hue, 42), 95%, 64%, 0.9),
                    calc(var(--sz, 9px) * 1.4) 0 0 hsla(var(--hue, 42), 95%, 64%, 0.9),
                    calc(var(--sz, 9px) * -1.4) 0 0 hsla(var(--hue, 42), 95%, 64%, 0.9),
                    calc(var(--sz, 9px) * 1.1) calc(var(--sz, 9px) * 1.1) 0 hsla(var(--hue, 42), 95%, 64%, 0.8),
                    calc(var(--sz, 9px) * -1.1) calc(var(--sz, 9px) * 1.1) 0 hsla(var(--hue, 42), 95%, 64%, 0.8),
                    calc(var(--sz, 9px) * 1.1) calc(var(--sz, 9px) * -1.1) 0 hsla(var(--hue, 42), 95%, 64%, 0.8),
                    calc(var(--sz, 9px) * -1.1) calc(var(--sz, 9px) * -1.1) 0 hsla(var(--hue, 42), 95%, 64%, 0.8);
                animation: sparkBurst var(--dur, 2s) ease-out forwards;
                animation-delay: var(--delay, 0s);
                transform: translate(-50%, -50%) rotate(var(--rot, 0deg)) scale(0.65);
            }

            [data-idletime-root].flit-is-christmas .flit-seasonal-banner {
                background: linear-gradient(120deg, #1e7f55, #3f5595);
                box-shadow: 0 6px 18px rgba(31, 127, 85, 0.25);
            }

            [data-idletime-root].flit-is-fireworks .flit-seasonal-banner {
                background: linear-gradient(120deg, #3f5595, #ff6f00);
                box-shadow: 0 6px 18px rgba(255, 111, 0, 0.25);
            }

            [data-idletime-root].flit-is-christmas .flit-spark-star { animation-play-state: running; }
            [data-idletime-root].flit-is-fireworks .flit-spark-firework { animation-play-state: running; }
            
            [data-idletime-root] .flit-rotating-message {
                height: 52px;
                margin: 0.6rem 0;
                position: relative;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            
            [data-idletime-root] .flit-rotating-message .flit-message-text {
                font-size: 1rem;
                font-weight: 500;
                color: #4a4a4a;
                margin: 0;
                line-height: 1.25;
                opacity: 0;
                transform: translate(-50%, 22px);
                transition: opacity 0.38s ease, transform 0.38s ease;
                position: absolute;
                left: 50%;
                transform-origin: center;
                will-change: transform, opacity;
                width: 100%;
                max-width: 560px;
                text-align: center;
                padding: 0 8px;
            }
            
            [data-idletime-root] .flit-rotating-message .flit-message-text.flit-is-active {
                opacity: 1;
                transform: translate(-50%, 0);
                left: 50%;
            }

            [data-idletime-root] .flit-rotating-message .flit-message-text.flit-is-leaving {
                opacity: 0;
                transform: translate(-50%, -22px);
            }
            
            [data-idletime-root] .flit-qr-section {
                border-radius: 12px;
                padding: 0.4rem 0.35rem;
                margin: 0.5rem 0;
                position: relative;
                text-align: center;
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 10px;
                justify-self: center;
            }

            [data-idletime-root] .flit-qr-text {
                color: #333;
                font-weight: 600;
                font-size: 0.98rem;
                margin: 0;
                display: inline-flex;
                align-items: center;
                gap: 6px;
                flex: 1;
                line-height: 1.2;
                min-width: 0;
            }

            [data-idletime-root] .flit-qr-title {
                justify-content: flex-start;
            }

            [data-idletime-root] .flit-qr-scan {
                display: inline-flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 6px;
                color: #3f5595;
                font-weight: 700;
                text-align: center;
            }
            
            [data-idletime-root] .flit-qr-wrapper {
                position: relative;
                display: inline-block;
                padding: 0;
                border-radius: 12px;
                background: transparent;
                box-shadow: none;
                overflow: visible;
                flex-shrink: 0;
            }

            [data-idletime-root] .flit-qr-wrapper::after {
                content: '';
                position: absolute;
                inset: -4px;
                border-radius: 10px;
                box-shadow: 0 0 0 0 rgba(63,85,149,0.4);
                animation: qrPulse 2.4s ease-out infinite;
                z-index: 0;
                pointer-events: none;
            }

            @keyframes qrPulse {
                0% { box-shadow: 0 0 0 0 rgba(63,85,149,0.4); opacity: 0.95; }
                70% { box-shadow: 0 0 0 14px rgba(63,85,149,0); opacity: 0; }
                100% { box-shadow: 0 0 0 0 rgba(63,85,149,0); opacity: 0; }
            }
            
            [data-idletime-root] .flit-qr-image {
                position: relative;
                border-radius: 10px;
                display: block;
                width: 148px !important;
                height: 148px !important;
                background: #f7f7f7;
                z-index: 1;
            }

            [data-idletime-root] [data-idletime-root] .seasonal-overlay {
                position: absolute;
                inset: 0;
                pointer-events: none;
                display: none;
                overflow: hidden;
            }

            [data-idletime-root].flit-is-christmas .seasonal-overlay,
            [data-idletime-root].flit-is-fireworks .seasonal-overlay {
                display: block;
            }

            [data-idletime-root] .flit-spark {
                position: absolute;
                width: 8px;
                height: 8px;
                border-radius: 50%;
                opacity: 0;
            }

            @keyframes starFloat {
                0% { transform: translate(-50%, calc(-50% - 16px)) scale(0.75); opacity: 0; }
                10% { opacity: 0.95; }
                60% { opacity: 0.5; }
                100% { transform: translate(-50%, calc(-50% + 22px)) scale(1.2); opacity: 0; }
            }

            @keyframes sparkFire {
                0% { transform: scale(0.1); opacity: 0.95; }
                55% { transform: scale(1.35); opacity: 0.4; }
                100% { transform: scale(1.6); opacity: 0; }
            }

            @keyframes sparkBurst {
                0% { transform: translate(-50%, calc(-50% - 12px)) rotate(var(--rot, 0deg)) scale(0.3); opacity: 0; }
                8% { opacity: 0.95; }
                55% { transform: translate(-50%, -50%) rotate(var(--rot, 0deg)) scale(1.1); opacity: 0.55; }
                100% { transform: translate(-50%, calc(-50% + 8px)) rotate(var(--rot, 0deg)) scale(1.4); opacity: 0; }
            }
            
            [data-idletime-root] .flit-scan-indicator {
                display: flex;
                align-items: center;
                justify-content: center;
                margin-top: 0.6rem;
                font-size: 1rem;
                color: #333;
                font-weight: 600;
            }
            
            [data-idletime-root] .flit-benefits-grid {
                display: flex;
                justify-content: space-around;
                align-items: center;
                gap: 0.6rem;
                margin: 0.45rem 0;
                padding: 0.35rem;
            }
            
            [data-idletime-root] .flit-benefit-item {
                text-align: center;
                flex: 1;
            }
            
            [data-idletime-root] .flit-benefit-item i {
                font-size:  2rem;
                color: #FF6F00;
                margin-bottom: 0.3rem;
                display: block;
            }
            
            [data-idletime-root] .flit-benefit-item p {
                margin: 0;
                font-size: 0.83rem;
                font-weight: 600;
                color: #666;
            }
            
            [data-idletime-root] .flit-footer-info {
                margin-top: 0.8rem ! important;
                padding-top:  0.8rem !important;
                border-top: 1px solid #eee;
            }
            
            [data-idletime-root] .flit-footer-info p {
                color: #666;
                font-size: 0.9rem;
                margin: 0;
                display: inline-flex;
                align-items: center;
                gap: 6px;
                letter-spacing: 0.3px;
            }

            [data-idletime-root] .flit-tiny {
                font-size: 1rem;
            }
        </style>

    <div class="flit-screensaver">
            <div class="flit-row">
                <div class="flit-col">
                    
                                        <div class="flit-card">
                                                                <div class="flit-seasonal-banner" data-flit-seasonal-banner>
                                                <span data-seasonal-text></span>
                                                <span class="flit-seasonal-effects" aria-hidden="true"></span>
                                            </div>

                                            <div class="flit-card-image">
                                            <img src="https://www.fewlines.com.ar/images/Logo_AzulGrisOscuro.png" width="761" height="191" loading="lazy" decoding="async" alt="Few Lines logo">
                    </div>
                    <div class="flit-card-content">
                      <!-- Propuesta de Valor -->
                      <p class="flit-value-prop flit-center">
                          <span class="flit-accent" style="font-weight: 600;">Soluciones simples</span> para problemas complejos
                      </p>
                      <!-- Mensajes Rotativos -->
                      <div class="flit-rotating-message flit-center">
                                                    <p class="flit-message-text flit-is-active"></p>
                                                    <p class="flit-message-text"></p>
                      </div>
                      
                      <!-- Beneficios Grid (Horizontal) -->
                      <div class="flit-benefits-grid">
                          <div class="flit-benefit-item">
                              <i class="flit-icon" aria-hidden="true">⚡</i>
                              <p>Rápido</p>
                          </div>
                          <div class="flit-benefit-item">
                              <i class="flit-icon" aria-hidden="true">✓</i>
                              <p>Confiable</p>
                          </div>
                          <div class="flit-benefit-item">
                              <i class="flit-icon" aria-hidden="true">↗</i>
                              <p>Escalable</p>
                          </div>
                      </div>
                      
                      <!-- Sección QR (ahora es el CTA principal) -->
                      <div class="flit-qr-section">
                          <!-- <p class="flit-qr-text flit-qr-title">¿Hablamos de tu proyecto?</p> -->
                          <a class="flit-qr-wrapper" data-qr-link target="_blank" rel="noopener">
                              <img class="flit-qr-image" data-flit-qr-image src="" alt="QR hacia WhatsApp" loading="lazy" decoding="async">
                          </a>
                          <!-- <p class="flit-qr-text flit-qr-scan">
                              <i class="flit-icon" aria-hidden="true">📷</i>
                              Apunta tu cámara aquí
                          </p> -->
                      </div>
                      
                      <!-- Footer Info -->
                      <div class="flit-center flit-footer-info">
                          <p>
                              <i class="flit-icon flit-tiny" style="vertical-align: middle;" aria-hidden="true">☎</i>
                              <span data-phone-display></span>
                          </p>
                      </div>
                      
                    </div>
                  </div>
                </div>
            </div>
        </div>
        
        <!-- Auto-init hack: img onerror executes even when inserted via DOMParser -->
        <img src="data:image/gif;base64,INVALID" style="display:none" onerror="(function(evt){
            const root = evt.target.closest('[data-idletime-root]');
            if (!root || root.dataset.idletimeInitialized) return;
            root.dataset.idletimeInitialized = 'true';
            
            const phoneNumber = '5491165177711';
            const whatsappUrl = 'https://wa.me/' + phoneNumber;
            const messages = [
                '💼 Transformamos tu negocio con tecnología a medida',
                '🚀 Despega tu empresa hacia el futuro digital',
                '✨ Hacemos realidad tus ideas tecnológicas',
                '🎯 Tu socio ideal en desarrollo web y gestión'
            ];
            
            // Format phone
            const phoneDisplay = root.querySelector('[data-phone-display]');
            if (phoneDisplay) {
                phoneDisplay.textContent = '+' + phoneNumber.slice(0,2) + ' ' + phoneNumber.slice(2,3) + ' ' + phoneNumber.slice(3,5) + ' ' + phoneNumber.slice(5,9) + '-' + phoneNumber.slice(9,13);
            }
            
            // Update QR
            const qrImg = root.querySelector('[data-flit-qr-image]');
            const qrLink = root.querySelector('[data-qr-link]');
            if (qrImg && qrLink) {
                const qrSrc = 'https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=' + encodeURIComponent(whatsappUrl);
                qrImg.src = qrSrc;
                qrImg.setAttribute('srcset', qrSrc + ' 1x, https://api.qrserver.com/v1/create-qr-code/?size=360x360&data=' + encodeURIComponent(whatsappUrl) + ' 2x');
                qrLink.href = whatsappUrl;
            }
            
            // Start messages
            const nodes = Array.from(root.querySelectorAll('.flit-message-text'));
            if (nodes.length > 0) {
                let slot = 0, msgIndex = 0;
                nodes[slot].textContent = messages[msgIndex];
                msgIndex = (msgIndex + 1) % messages.length;
                
                setInterval(function() {
                    const current = nodes[slot];
                    const nextSlot = (slot + 1) % nodes.length;
                    const next = nodes[nextSlot];
                    next.textContent = messages[msgIndex];
                    msgIndex = (msgIndex + 1) % messages.length;
                    current.classList.remove('flit-is-active');
                    current.classList.add('flit-is-leaving');
                    next.classList.remove('flit-is-leaving');
                    requestAnimationFrame(function() { next.classList.add('flit-is-active'); });
                    setTimeout(function() { current.classList.remove('flit-is-leaving'); }, 420);
                    slot = nextSlot;
                }, 2800);
            }
            
            // Seasonal effects
            const today = new Date();
            const month = today.getMonth();
            const day = today.getDate();
            const banner = root.querySelector('[data-flit-seasonal-banner]');
            const bannerText = root.querySelector('[data-seasonal-text]');
            
            if (banner && bannerText) {
                let mode = '';
                if (month === 11 && day >= 8 && day <= 25) {
                    mode = 'flit-is-christmas';
                    bannerText.textContent = '🎄 ¡Feliz Navidad!';
                } else if ((month === 11 && day >= 26) || (month === 0 && day <= 1)) {
                    mode = 'flit-is-fireworks';
                    bannerText.textContent = '🎆 ¡Felices fiestas!';
                }
                
                if (mode) {
                    const effects = root.querySelector('.flit-seasonal-effects');
                    function createSpark() {
                        if (!effects) return;
                        const roll = Math.random();
                        const x = roll < 0.35 ? 4 + Math.random() * 18 : roll < 0.7 ? 78 + Math.random() * 18 : 20 + Math.random() * 60;
                        const y = -4 + Math.random() * 108;
                        const s = document.createElement('span');
                        s.style.left = x + '%';
                        s.style.top = y + '%';
                        
                        if (mode === 'flit-is-christmas') {
                            s.className = 'flit-spark flit-spark-star';
                            s.style.setProperty('--scale', (0.65 + Math.random() * 0.75).toFixed(2));
                            const dur = 2.2 + Math.random() * 1.6;
                            s.style.setProperty('--dur', dur.toFixed(2) + 's');
                            s.style.setProperty('--delay', '0s');
                            s.addEventListener('animationend', function() { s.remove(); createSpark(); }, {once: true});
                        } else {
                            s.className = 'flit-spark flit-spark-firework';
                            s.style.setProperty('--sz', (7 + Math.random() * 7).toFixed(1) + 'px');
                            s.style.setProperty('--hue', (30 + Math.random() * 50).toFixed(0));
                            s.style.setProperty('--rot', Math.floor(Math.random() * 360) + 'deg');
                            const dur = 1.4 + Math.random() * 1;
                            s.style.setProperty('--dur', dur.toFixed(2) + 's');
                            s.style.setProperty('--delay', '0s');
                            s.addEventListener('animationend', function() { s.remove(); createSpark(); }, {once: true});
                        }
                        effects.appendChild(s);
                    }
                    
                    const count = mode === 'flit-is-christmas' ? 5 + Math.floor(Math.random() * 5) : 5 + Math.floor(Math.random() * 4);
                    for (let i = 0; i < count; i++) {
                        setTimeout(createSpark, (i / count) * 2400);
                    }
                    
                    root.classList.add(mode);
                    banner.classList.add('flit-is-visible');
                }
            }
        })(event)">
    </div>
        
    </body>
</html>
