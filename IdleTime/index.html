<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <div data-idletime-root>
            <!-- Compiled and minified CSS -->
            <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
            <!-- Material Icons -->
            <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
            
            <style>
            [data-idletime-root] {
                all: initial;
                display: block;
            }
            
            [data-idletime-root] *,
            [data-idletime-root] *::before,
            [data-idletime-root] *::after {
                box-sizing: border-box;
            }

            [data-idletime-root] body,
            [data-idletime-root] > .container {
                background: #f5f6f8;
                overflow: hidden;
                margin: 0;
                padding: 6px 0;
            }
            
            [data-idletime-root] .screensaver-container {
                animation: fadeIn 0.8s ease-in;
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                padding: 0 12px;
            }
            
            @keyframes fadeIn {
                from { opacity: 0; transform: scale(0.95); }
                to { opacity:  1; transform: scale(1); }
            }
            
            [data-idletime-root] .card {
                border-radius: 16px !important;
                box-shadow: 0 16px 48px rgba(0,0,0,0.18) !important;
                margin: 0 !important;
                max-width: 600px;
                max-height: 550px;
                width: 100%;
                overflow: hidden;
                position: relative;
                background: white;
            }

            [data-idletime-root] .row {
                margin: 0;
            }
            
            [data-idletime-root] .card-image {
                padding-top: 12px;
            }
            
            [data-idletime-root] .card-image img {
                border-radius: 14px;
                max-height: 110px !important;
                object-fit: contain !important;
                padding: 12px 44px !important;
                width: 100%;
                height: auto;
                image-rendering: -webkit-optimize-contrast;
            }
            
            [data-idletime-root] .card-content {
                padding: 10px !important;
            }
            
            [data-idletime-root] .value-prop {
                font-size: 1.05rem !important;
                line-height: 1.35 !important;
                margin: 0.35rem 0 !important;
            }

            [data-idletime-root] .seasonal-banner {
                display: none;
                align-items: center;
                justify-content: center;
                gap: 8px;
                padding: 8px 10px;
                border-radius: 10px;
                font-weight: 700;
                font-size: 0.98rem;
                letter-spacing: 0.2px;
                color: #fff;
                margin: 0.25rem 0 0.35rem 0;
                position: relative;
                overflow: hidden;
                top: -4px;
                height: 40px;
                border-radius: 0px;
            }
            [data-idletime-root] .seasonal-banner [data-seasonal-text] {
                position: relative;
                z-index: 2;
            }
            [data-idletime-root] .seasonal-banner.is-visible {
                display: flex;
            }

            [data-idletime-root] [data-idletime-root] .seasonal-banner .seasonal-effects {
                position: absolute;
                inset: 0;
                pointer-events: none;
                z-index: 1;
            }

            [data-idletime-root] .seasonal-banner .spark {
                position: absolute;
                width: 10px;
                height: 10px;
                opacity: 0;
                transform-origin: center;
                transform: translate(-50%, -50%);
            }

            [data-idletime-root] .spark-star {
                background: #fff6d5;
                clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
                box-shadow: 0 0 8px rgba(255, 246, 213, 0.8);
                animation: starFloat var(--dur, 3s) ease-in-out forwards;
                animation-delay: var(--delay, 0s);
                transform: translate(-50%, -50%) scale(var(--scale, 1));
            }

            [data-idletime-root] .spark-firework {
                width: var(--sz, 9px);
                height: var(--sz, 9px);
                border-radius: 50%;
                background: hsl(var(--hue, 42), 95%, 64%);
                box-shadow:
                    0 calc(var(--sz, 9px) * -1.4) 0 hsla(var(--hue, 42), 95%, 64%, 0.9),
                    0 calc(var(--sz, 9px) * 1.4) 0 hsla(var(--hue, 42), 95%, 64%, 0.9),
                    calc(var(--sz, 9px) * 1.4) 0 0 hsla(var(--hue, 42), 95%, 64%, 0.9),
                    calc(var(--sz, 9px) * -1.4) 0 0 hsla(var(--hue, 42), 95%, 64%, 0.9),
                    calc(var(--sz, 9px) * 1.1) calc(var(--sz, 9px) * 1.1) 0 hsla(var(--hue, 42), 95%, 64%, 0.8),
                    calc(var(--sz, 9px) * -1.1) calc(var(--sz, 9px) * 1.1) 0 hsla(var(--hue, 42), 95%, 64%, 0.8),
                    calc(var(--sz, 9px) * 1.1) calc(var(--sz, 9px) * -1.1) 0 hsla(var(--hue, 42), 95%, 64%, 0.8),
                    calc(var(--sz, 9px) * -1.1) calc(var(--sz, 9px) * -1.1) 0 hsla(var(--hue, 42), 95%, 64%, 0.8);
                animation: sparkBurst var(--dur, 2s) ease-out forwards;
                animation-delay: var(--delay, 0s);
                transform: translate(-50%, -50%) rotate(var(--rot, 0deg)) scale(0.65);
            }

            [data-idletime-root].is-christmas .seasonal-banner {
                background: linear-gradient(120deg, #1e7f55, #3f5595);
                box-shadow: 0 6px 18px rgba(31, 127, 85, 0.25);
            }

            [data-idletime-root].is-fireworks .seasonal-banner {
                background: linear-gradient(120deg, #3f5595, #ff6f00);
                box-shadow: 0 6px 18px rgba(255, 111, 0, 0.25);
            }

            [data-idletime-root].is-christmas .spark-star { animation-play-state: running; }
            [data-idletime-root].is-fireworks .spark-firework { animation-play-state: running; }
            
            [data-idletime-root] .rotating-message {
                height: 52px;
                margin: 0.6rem 0;
                position: relative;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            
            [data-idletime-root] .rotating-message .message-text {
                font-size: 1rem;
                font-weight: 500;
                color: #4a4a4a;
                margin: 0;
                line-height: 1.25;
                opacity: 0;
                transform: translate(-50%, 22px);
                transition: opacity 0.38s ease, transform 0.38s ease;
                position: absolute;
                left: 50%;
                transform-origin: center;
                will-change: transform, opacity;
                width: 100%;
                max-width: 560px;
                text-align: center;
                padding: 0 8px;
            }
            
            [data-idletime-root] .rotating-message .message-text.is-active {
                opacity: 1;
                transform: translate(-50%, 0);
                left: 50%;
            }

            [data-idletime-root] .rotating-message .message-text.is-leaving {
                opacity: 0;
                transform: translate(-50%, -22px);
            }
            
            [data-idletime-root] .qr-section {
                border-radius: 12px;
                padding: 0.4rem 0.35rem;
                margin: 0.5rem 0;
                position: relative;
                text-align: center;
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 10px;
            }

            [data-idletime-root] .qr-text {
                color: #333;
                font-weight: 600;
                font-size: 0.98rem;
                margin: 0;
                display: inline-flex;
                align-items: center;
                gap: 6px;
                flex: 1;
                line-height: 1.2;
                min-width: 0;
            }

            [data-idletime-root] .qr-title {
                justify-content: flex-start;
            }

            [data-idletime-root] .qr-scan {
                display: inline-flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 6px;
                color: #3f5595;
                font-weight: 700;
                text-align: center;
            }
            
            [data-idletime-root] .qr-wrapper {
                position: relative;
                display: inline-block;
                padding: 0;
                border-radius: 12px;
                background: transparent;
                box-shadow: none;
                overflow: visible;
                flex-shrink: 0;
            }

            [data-idletime-root] .qr-wrapper::after {
                content: '';
                position: absolute;
                inset: -4px;
                border-radius: 10px;
                box-shadow: 0 0 0 0 rgba(63,85,149,0.4);
                animation: qrPulse 2.4s ease-out infinite;
                z-index: 0;
                pointer-events: none;
            }

            @keyframes qrPulse {
                0% { box-shadow: 0 0 0 0 rgba(63,85,149,0.4); opacity: 0.95; }
                70% { box-shadow: 0 0 0 14px rgba(63,85,149,0); opacity: 0; }
                100% { box-shadow: 0 0 0 0 rgba(63,85,149,0); opacity: 0; }
            }
            
            [data-idletime-root] .qr-image {
                position: relative;
                border-radius: 10px;
                display: block;
                width: 148px !important;
                height: 148px !important;
                background: #f7f7f7;
                z-index: 1;
            }

            [data-idletime-root] [data-idletime-root] .seasonal-overlay {
                position: absolute;
                inset: 0;
                pointer-events: none;
                display: none;
                overflow: hidden;
            }

            [data-idletime-root].is-christmas .seasonal-overlay,
            [data-idletime-root].is-fireworks .seasonal-overlay {
                display: block;
            }

            [data-idletime-root] .spark {
                position: absolute;
                width: 8px;
                height: 8px;
                border-radius: 50%;
                opacity: 0;
            }

            @keyframes starFloat {
                0% { transform: translate(-50%, calc(-50% - 16px)) scale(0.75); opacity: 0; }
                10% { opacity: 0.95; }
                60% { opacity: 0.5; }
                100% { transform: translate(-50%, calc(-50% + 22px)) scale(1.2); opacity: 0; }
            }

            @keyframes sparkFire {
                0% { transform: scale(0.1); opacity: 0.95; }
                55% { transform: scale(1.35); opacity: 0.4; }
                100% { transform: scale(1.6); opacity: 0; }
            }

            @keyframes sparkBurst {
                0% { transform: translate(-50%, calc(-50% - 12px)) rotate(var(--rot, 0deg)) scale(0.3); opacity: 0; }
                8% { opacity: 0.95; }
                55% { transform: translate(-50%, -50%) rotate(var(--rot, 0deg)) scale(1.1); opacity: 0.55; }
                100% { transform: translate(-50%, calc(-50% + 8px)) rotate(var(--rot, 0deg)) scale(1.4); opacity: 0; }
            }
            
            [data-idletime-root] .scan-indicator {
                display: flex;
                align-items: center;
                justify-content: center;
                margin-top: 0.6rem;
                font-size: 1rem;
                color: #333;
                font-weight: 600;
            }
            
            [data-idletime-root] .benefits-grid {
                display: flex;
                justify-content: space-around;
                align-items: center;
                gap: 0.6rem;
                margin: 0.45rem 0;
                padding: 0.35rem;
            }
            
            [data-idletime-root] .benefit-item {
                text-align: center;
                flex: 1;
            }
            
            [data-idletime-root] .benefit-item i {
                font-size:  2rem;
                color: #FF6F00;
                margin-bottom: 0.3rem;
                display: block;
            }
            
            [data-idletime-root] .benefit-item p {
                margin: 0;
                font-size: 0.83rem;
                font-weight: 600;
                color: #666;
            }
            
            [data-idletime-root] .footer-info {
                margin-top: 0.8rem ! important;
                padding-top:  0.8rem !important;
                border-top: 1px solid #eee;
            }
            
            [data-idletime-root] .footer-info p {
                color: #666;
                font-size: 0.9rem;
                margin: 0;
                display: inline-flex;
                align-items: center;
                gap: 6px;
                letter-spacing: 0.3px;
            }
            
            @media (max-height: 600px) {
                [data-idletime-root] body {
                    padding: 4px 0;
                }
                
                [data-idletime-root] .card-image img {
                    max-height: 74px !important;
                    padding: 10px 24px !important;
                }
                
                [data-idletime-root] .card-content {
                    padding: 8px !important;
                }
                
                [data-idletime-root] .value-prop {
                    font-size: 0.94rem !important;
                    margin: 0.26rem 0 !important;
                }
                
                [data-idletime-root] .rotating-message {
                    height: 42px;
                    margin: 0.5rem 0;
                }
                
                [data-idletime-root] .rotating-message .message-text {
                    font-size: 0.88rem;
                }
                
                [data-idletime-root] .qr-section {
                    padding: 0.5rem 0.3rem;
                    margin: 0.4rem 0;
                    gap: 8px;
                }
                
                [data-idletime-root] .qr-section h5 {
                    font-size: 1rem !important;
                    margin: 0 0 0.4rem 0 !important;
                }
                
                [data-idletime-root] .qr-wrapper::after {
                    inset: -3px;
                }

                [data-idletime-root] .qr-image {
                    width: 130px !important;
                    height: 130px !important;
                }
                
                [data-idletime-root] .scan-indicator {
                    margin-top: 0.4rem;
                    font-size: 0.88rem;
                }
                
                [data-idletime-root] .benefits-grid {
                    gap: 0.45rem;
                    margin:  0.4rem 0;
                    padding: 0.28rem;
                }
                
                [data-idletime-root] .benefit-item i {
                    font-size:  1.4rem;
                    margin-bottom: 0.18rem;
                }
                
                [data-idletime-root] .benefit-item p {
                    font-size: 0.74rem;
                }
                
                [data-idletime-root] .footer-info {
                    margin-top: 0.5rem !important;
                    padding-top: 0.5rem ! important;
                }
                
                [data-idletime-root] .footer-info p {
                    font-size: 0.78rem;
                }
            }
            
            @media (max-width: 600px) {
                [data-idletime-root] .benefits-grid {
                    flex-direction: column;
                    gap: 0.8rem;
                }

                [data-idletime-root] .qr-section {
                    flex-direction: column;
                    align-items: center;
                    text-align: center;
                    gap: 10px;
                }

                [data-idletime-root] .qr-text,
                [data-idletime-root] .qr-title,
                [data-idletime-root] .qr-scan {
                    justify-content: center;
                    text-align: center;
                    width: 100%;
                }
            }
        </style>

    <div class="screensaver-container">
            <div class="row">
                <div class="col s12 m10 offset-m1 l8 offset-l2">

                      <!-- Mensajes Rotativos -->
                      <div class="rotating-message center-align">

                      <!-- Beneficios Grid (Horizontal) -->

                      <!-- Sección QR (ahora es el CTA principal) -->
                      <div class="qr-section">

                      <!-- Footer Info -->
                      <div class="center-align footer-info">

                    </div>
                  </div>
                </div>
            </div>
        </div>
        
        <!-- Compiled and minified JavaScript -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
        <script>
        (function() {
            const phoneNumber = '5491165177711';
            const whatsappUrl = `https://wa.me/${phoneNumber}`;
            const messages = [
                '💼 Transformamos tu negocio con tecnología a medida',
                '🚀 Despega tu empresa hacia el futuro digital',
                '✨ Hacemos realidad tus ideas tecnológicas',
                '🎯 Tu socio ideal en desarrollo web y gestión'
            ];
            let seasonalTimer = null;
            let seasonalMode = '';

            function formatPhone(num) {
                return `+${num.slice(0, 2)} ${num.slice(2, 3)} ${num.slice(3, 5)} ${num.slice(5, 9)}-${num.slice(9, 13)}`;
            }

            function updateQR() {
                const root = document.querySelector('[data-idletime-root]');
                const qrImg = root.querySelector('[data-qr-image]');
                const qrLink = root.querySelector('[data-qr-link]');
                const qrData = encodeURIComponent(whatsappUrl);
                const qrSrc = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${qrData}`;
                qrImg.src = qrSrc;
                qrImg.setAttribute('srcset', `${qrSrc} 1x, https://api.qrserver.com/v1/create-qr-code/?size=360x360&data=${qrData} 2x`);
                qrLink.href = whatsappUrl;
            }

            function startMessages() {
                const root = document.querySelector('[data-idletime-root]');
                const nodes = Array.from(root.querySelectorAll('.message-text'));
                let slot = 0;
                let msgIndex = 0;

                // initialize first message
                nodes[slot].textContent = messages[msgIndex];
                msgIndex = (msgIndex + 1) % messages.length;

                const cycle = () => {
                    const current = nodes[slot];
                    const nextSlot = (slot + 1) % nodes.length;
                    const next = nodes[nextSlot];

                    next.textContent = messages[msgIndex];
                    msgIndex = (msgIndex + 1) % messages.length;

                    current.classList.remove('is-active');
                    current.classList.add('is-leaving');
                    next.classList.remove('is-leaving');

                    // allow browser to register state before activating next
                    requestAnimationFrame(() => {
                        next.classList.add('is-active');
                    });

                    // cleanup leaving state after transition
                    setTimeout(() => {
                        current.classList.remove('is-leaving');
                    }, 420);

                    slot = nextSlot;
                };

                setInterval(cycle, 2800);
            }

            function createSpark(mode, initialDelay = 0) {
                const root = document.querySelector('[data-idletime-root]');
                const effects = root.querySelector('.seasonal-effects');
                if (!effects) return;

                const randPos = () => {
                    const roll = Math.random();
                    if (roll < 0.35) return 4 + Math.random() * 18;
                    if (roll < 0.7) return 78 + Math.random() * 18;
                    return 20 + Math.random() * 60;
                };
                const randY = () => -4 + Math.random() * 108;

                const s = document.createElement('span');
                s.style.left = `${randPos()}%`;
                s.style.top = `${randY()}%`;

                if (mode === 'is-christmas') {
                    s.className = 'spark spark-star';
                    s.style.setProperty('--scale', (0.65 + Math.random() * 0.75).toFixed(2));
                    const dur = 2.2 + Math.random() * 1.6;
                    s.style.setProperty('--dur', `${dur.toFixed(2)}s`);
                    s.style.setProperty('--delay', `${initialDelay.toFixed(2)}s`);

                    s.addEventListener('animationend', () => {
                        s.remove();
                        createSpark(mode, 0);
                    }, { once: true });
                } else if (mode === 'is-fireworks') {
                    s.className = 'spark spark-firework';
                    s.style.setProperty('--sz', `${(7 + Math.random() * 7).toFixed(1)}px`);
                    s.style.setProperty('--hue', `${30 + Math.random() * 50}`);
                    s.style.setProperty('--rot', `${Math.floor(Math.random() * 360)}deg`);
                    const dur = 1.4 + Math.random() * 1;
                    s.style.setProperty('--dur', `${dur.toFixed(2)}s`);
                    s.style.setProperty('--delay', `${initialDelay.toFixed(2)}s`);

                    s.addEventListener('animationend', () => {
                        s.remove();
                        createSpark(mode, 0);
                    }, { once: true });
                }

                effects.appendChild(s);
            }

            function initSeasonalSparks(mode) {
                const randInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
                const count = mode === 'is-christmas' ? randInt(5, 9) : randInt(5, 8);

                for (let i = 0; i < count; i++) {
                    const stagger = (i / count) * 2.4;
                    createSpark(mode, stagger);
                }
            }

            function applySeasonalEffects() {
                const today = new Date();
                const month = today.getMonth(); // 0-based
                const day = today.getDate();
                const root = document.querySelector('[data-idletime-root]');
                const banner = root.querySelector('[data-seasonal-banner]');
                const bannerText = root.querySelector('[data-seasonal-text]');

                let mode = '';
                if (month === 11 && day >= 8 && day <= 25) {
                    mode = 'is-christmas';
                    bannerText.textContent = '🎄 ¡Feliz Navidad!';
                } else if ((month === 11 && day >= 26) || (month === 0 && day <= 1)) {
                    mode = 'is-fireworks';
                    bannerText.textContent = '🎆 ¡Felices fiestas!';
                }

                if (!mode) return;

                seasonalMode = mode;
                initSeasonalSparks(mode);

                root.classList.add(mode);
                banner.classList.add('is-visible');
            }

            function init() {
                const root = document.querySelector('[data-idletime-root]');
                const phoneDisplay = root.querySelector('[data-phone-display]');
                phoneDisplay.textContent = formatPhone(phoneNumber);
                updateQR();
                startMessages();
                applySeasonalEffects();
            }

            // Execute init when DOM is ready
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
        </script>
    </div>
    </body>
</html>
